<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" fill="none">
  <!-- Black background -->
  <rect width="580" height="420" fill="#000000"/>
  
  <!-- Top chevron -->
  <path d="M290 60 L320 110 L260 110 Z" fill="none" stroke="#c9a96e" stroke-width="3"/>
  
  <!-- Hut 1 (top) -->
  <g transform="translate(140, 130)">
    <!-- Roof -->
    <path d="M50 0 L100 45 L0 45 Z" fill="#b8956a"/>
    <!-- Base -->
    <rect x="15" y="45" width="70" height="55" fill="#b8956a"/>
    <!-- Door -->
    <rect x="35" y="60" width="20" height="35" fill="#000000"/>
    <!-- Roof extension left -->
    <line x1="0" y1="45" x2="-20" y2="40" stroke="#b8956a" stroke-width="3"/>
    <!-- Roof extension right -->
    <line x1="100" y1="45" x2="120" y2="40" stroke="#b8956a" stroke-width="3"/>
  </g>
  
  <!-- Hut 2 (bottom left) -->
  <g transform="translate(80, 220)">
    <!-- Roof -->
    <path d="M50 0 L100 45 L0 45 Z" fill="#b8956a"/>
    <!-- Base -->
    <rect x="15" y="45" width="70" height="55" fill="#b8956a"/>
    <!-- Door -->
    <rect x="35" y="60" width="20" height="35" fill="#000000"/>
  </g>
  
  <!-- Hut 3 (bottom right) -->
  <g transform="translate(200, 220)">
    <!-- Roof -->
    <path d="M50 0 L100 45 L0 45 Z" fill="#b8956a"/>
    <!-- Base -->
    <rect x="15" y="45" width="70" height="55" fill="#b8956a"/>
    <!-- Door -->
    <rect x="35" y="60" width="20" height="35" fill="#000000"/>
  </g>
  
  <!-- Vertical separator line -->
  <rect x="310" y="120" width="3" height="180" fill="#c9a96e"/>
  
  <!-- VILLAGE text - blocky style -->
  <text x="340" y="210" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" fill="#c9a96e" letter-spacing="4">VILLAGE</text>
  
  <!-- ALLURE text -->
  <text x="340" y="285" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" fill="#c9a96e" letter-spacing="4">ALLURE</text>
  
  <!-- Bottom decorative shape -->
  <path d="M180 340 L400 340 L420 370 L160 370 Z" fill="none" stroke="#c9a96e" stroke-width="3"/>
</svg>
